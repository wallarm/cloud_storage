name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.4', '4.0']

    env:
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: test
      GCS_ENDPOINT: http://localhost:8080/
      GCS_BUCKET: some-bucket

    steps:
      - uses: actions/checkout@v4

      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs \
            -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            docker.io/chrislusf/seaweedfs:4.48 \
            mini -dir=/data -webdav=false -admin.ui=false \
              -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0 -s3.autoCreateBucket=false \
              -bucket=test

      - name: Start fake-gcs-server
        run: |
          docker run -d --name gcs \
            -p 8080:8080 \
            --entrypoint sh \
            fsouza/fake-gcs-server \
            -c 'mkdir -p /data/some-bucket && /bin/fake-gcs-server -port 8080 -scheme http -external-url=http://localhost:8080 -public-host=localhost:8080 -filesystem-root /data'

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sfI --aws-sigv4 aws:amz:us-east-1:s3 --user minioadmin:minioadmin http://localhost:9000/test \
              && curl -sf "http://localhost:8080/storage/v1/b/$GCS_BUCKET" >/dev/null && exit 0
            sleep 1
          done
          echo "SeaweedFS or fake-gcs-server did not become ready" >&2
          exit 1

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rubocop --display-style-guide --extra-details

      - name: RSpec
        run: bundle exec rspec
