version: '3.3'

services:
  app:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.dip
      args:
        DOCKER_RUBY_VERSION: $DOCKER_RUBY_VERSION
      labels:
        com.cloud_storage.ruby.version: $DOCKER_RUBY_VERSION
    environment:
      - BUNDLE_PATH=/bundle/${DOCKER_RUBY_VERSION}
      - S3_ENDPOINT=$S3_ENDPOINT
      - S3_BUCKET=$S3_BUCKET
      - GCS_ENDPOINT=$GCS_ENDPOINT
      - GCS_BUCKET=$GCS_BUCKET
    volumes:
      - ..:/app
      - bundler-data:/bundle
    command: sh
    depends_on:
      s3:
        condition: service_healthy
      gcs:
        condition: service_started

  s3:
    image: docker.io/chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-webdav=false", "-admin.ui=false",
              "-s3.port=9000", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.autoCreateBucket=false",
              "-bucket=${S3_BUCKET}"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    healthcheck:
      test: ["CMD-SHELL", "for b in ${S3_BUCKET}; do curl -sfI --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY\" http://localhost:9000/$$b || exit 1; done"]
      interval: 1s
      retries: 30

  gcs:
    image: fsouza/fake-gcs-server
    volumes:
      - ../uploads/gcs:/data
    expose:
      - "8080"
    entrypoint: >
      /bin/fake-gcs-server -port 8080 -scheme http -external-url=http://gcs:8080 -public-host=gcs:8080 -filesystem-root /data

volumes:
  bundler-data:
    name: bundler_data
    external: true
